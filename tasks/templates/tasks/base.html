<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Менеджер задач{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'task_list' %}">
                <i class="bi bi-check2-square me-1"></i> ToDo App
            </a>
            <div class="d-flex align-items-center">
                <a href="{% url 'task_create' %}" class="btn btn-light btn-sm fw-semibold me-2">
                    <i class="bi bi-plus-lg me-1"></i> Добавить задачу
                </a>
                <a href="/admin/" class="btn btn-outline-light btn-sm" target="_blank">
                    <i class="bi bi-shield-lock me-1"></i> Админка
                </a>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
